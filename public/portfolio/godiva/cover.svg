<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d1a00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8932a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0c060;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8932a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0800;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1440" height="900" fill="url(#bg)" />

  <!-- Decorative gold lines -->
  <line x1="0" y1="60" x2="1440" y2="60" stroke="#c8932a" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="840" x2="1440" y2="840" stroke="#c8932a" stroke-width="0.5" opacity="0.4"/>

  <!-- Left decorative panel -->
  <rect x="0" y="0" width="3" height="900" fill="url(#gold)" opacity="0.6"/>
  <rect x="1437" y="0" width="3" height="900" fill="url(#gold)" opacity="0.6"/>

  <!-- Center logo area -->
  <g transform="translate(720, 200)">
    <!-- Decorative diamond -->
    <polygon points="0,-22 16,0 0,22 -16,0" fill="none" stroke="url(#gold)" stroke-width="1.5"/>
    <!-- GODIVA wordmark -->
    <text x="0" y="-50" font-family="Georgia, serif" font-size="52" font-weight="normal" fill="url(#gold)" text-anchor="middle" letter-spacing="16">GODIVA</text>
    <!-- Tagline -->
    <text x="0" y="60" font-family="Georgia, serif" font-size="14" fill="#d4a853" text-anchor="middle" letter-spacing="6" opacity="0.9">CHOCOLATIER SINCE 1926</text>
    <!-- Thin rule -->
    <line x1="-80" y1="78" x2="80" y2="78" stroke="#c8932a" stroke-width="0.5" opacity="0.7"/>
  </g>

  <!-- Product cards row -->
  <g transform="translate(180, 380)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="220" height="280" rx="4" fill="url(#cardGrad)" stroke="#c8932a" stroke-width="0.5" opacity="0.8"/>
    <rect x="12" y="12" width="196" height="180" rx="3" fill="#3d1a00" opacity="0.6"/>
    <circle cx="110" cy="102" r="48" fill="#2a0e00" stroke="#c8932a" stroke-width="0.5" opacity="0.5"/>
    <text x="110" y="107" font-family="Georgia, serif" font-size="11" fill="#d4a853" text-anchor="middle" opacity="0.8">Truffles</text>
    <text x="110" y="220" font-family="Georgia, serif" font-size="12" fill="#f0c060" text-anchor="middle">Gold Collection</text>
    <text x="110" y="240" font-family="Georgia, serif" font-size="10" fill="#c8932a" text-anchor="middle">12-piece box</text>
    <text x="110" y="260" font-family="Georgia, serif" font-size="13" fill="#f0c060" text-anchor="middle">$38.00</text>

    <!-- Card 2 -->
    <rect x="270" y="0" width="220" height="280" rx="4" fill="url(#cardGrad)" stroke="#c8932a" stroke-width="0.5" opacity="0.8"/>
    <rect x="282" y="12" width="196" height="180" rx="3" fill="#3d1a00" opacity="0.6"/>
    <circle cx="380" cy="102" r="48" fill="#2a0e00" stroke="#c8932a" stroke-width="0.5" opacity="0.5"/>
    <text x="380" y="107" font-family="Georgia, serif" font-size="11" fill="#d4a853" text-anchor="middle" opacity="0.8">Dark</text>
    <text x="380" y="220" font-family="Georgia, serif" font-size="12" fill="#f0c060" text-anchor="middle">Dark Indulgence</text>
    <text x="380" y="240" font-family="Georgia, serif" font-size="10" fill="#c8932a" text-anchor="middle">24-piece box</text>
    <text x="380" y="260" font-family="Georgia, serif" font-size="13" fill="#f0c060" text-anchor="middle">$62.00</text>

    <!-- Card 3 -->
    <rect x="540" y="0" width="220" height="280" rx="4" fill="url(#cardGrad)" stroke="#c8932a" stroke-width="0.5" opacity="0.8"/>
    <rect x="552" y="12" width="196" height="180" rx="3" fill="#3d1a00" opacity="0.6"/>
    <circle cx="650" cy="102" r="48" fill="#2a0e00" stroke="#c8932a" stroke-width="0.5" opacity="0.5"/>
    <text x="650" y="107" font-family="Georgia, serif" font-size="11" fill="#d4a853" text-anchor="middle" opacity="0.8">Seasonal</text>
    <text x="650" y="220" font-family="Georgia, serif" font-size="12" fill="#f0c060" text-anchor="middle">Gift Elegance</text>
    <text x="650" y="240" font-family="Georgia, serif" font-size="10" fill="#c8932a" text-anchor="middle">Holiday Edition</text>
    <text x="650" y="260" font-family="Georgia, serif" font-size="13" fill="#f0c060" text-anchor="middle">$85.00</text>

    <!-- Card 4 -->
    <rect x="810" y="0" width="220" height="280" rx="4" fill="url(#cardGrad)" stroke="#c8932a" stroke-width="0.5" opacity="0.8"/>
    <rect x="822" y="12" width="196" height="180" rx="3" fill="#3d1a00" opacity="0.6"/>
    <circle cx="920" cy="102" r="48" fill="#2a0e00" stroke="#c8932a" stroke-width="0.5" opacity="0.5"/>
    <text x="920" y="107" font-family="Georgia, serif" font-size="11" fill="#d4a853" text-anchor="middle" opacity="0.8">Gems</text>
    <text x="920" y="220" font-family="Georgia, serif" font-size="12" fill="#f0c060" text-anchor="middle">Chocolate Gems</text>
    <text x="920" y="240" font-family="Georgia, serif" font-size="10" fill="#c8932a" text-anchor="middle">Assorted gems</text>
    <text x="920" y="260" font-family="Georgia, serif" font-size="13" fill="#f0c060" text-anchor="middle">$24.00</text>
  </g>

  <!-- Bottom nav bar -->
  <rect x="0" y="720" width="1440" height="60" fill="#0d0500" opacity="0.9"/>
  <g fill="#d4a853" font-family="Georgia, serif" font-size="12" letter-spacing="3" opacity="0.8">
    <text x="200" y="756" text-anchor="middle">CHOCOLATES</text>
    <text x="450" y="756" text-anchor="middle">GIFTS</text>
    <text x="700" y="756" text-anchor="middle">OCCASIONS</text>
    <text x="950" y="756" text-anchor="middle">REWARDS</text>
    <text x="1200" y="756" text-anchor="middle">FIND A STORE</text>
  </g>

  <!-- Top nav bar -->
  <rect x="0" y="0" width="1440" height="60" fill="#0d0500" opacity="0.95"/>
  <text x="720" y="38" font-family="Georgia, serif" font-size="22" fill="url(#gold)" text-anchor="middle" letter-spacing="10">GODIVA</text>
  <text x="120" y="37" font-family="Georgia, serif" font-size="10" fill="#d4a853" text-anchor="middle" letter-spacing="2" opacity="0.7">FREE SHIPPING $75+</text>
  <text x="1320" y="37" font-family="Georgia, serif" font-size="10" fill="#d4a853" text-anchor="middle" letter-spacing="2" opacity="0.7">REWARDS  e  CART</text>
</svg>
