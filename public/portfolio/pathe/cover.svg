<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a0a14"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="rgba(220,38,38,0.25)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="960" height="640" fill="url(#bg)"/>
  <rect width="960" height="640" fill="url(#spotlight)"/>
  <!-- seat rows hint -->
  <ellipse cx="480" cy="580" rx="460" ry="80" fill="rgba(255,255,255,0.02)"/>
  <ellipse cx="480" cy="560" rx="380" ry="60" fill="rgba(255,255,255,0.02)"/>
  <ellipse cx="480" cy="540" rx="300" ry="45" fill="rgba(255,255,255,0.02)"/>
  <!-- screen glow -->
  <rect x="160" y="80" width="640" height="200" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- wordmark -->
  <text x="480" y="205" text-anchor="middle" fill="#fff" font-family="Georgia,serif" font-size="80" font-weight="700" letter-spacing="4">Pathé</text>
  <text x="480" y="238" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="system-ui,sans-serif" font-size="14" letter-spacing="6">BELGIUM · CINEMAS</text>
  <!-- cinema facts -->
  <text x="240" y="350" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="system-ui,sans-serif" font-size="28" font-weight="700">7</text>
  <text x="240" y="374" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="system-ui,sans-serif" font-size="13">Cinemas</text>
  <text x="480" y="350" text-anchor="middle" fill="rgba(220,38,38,0.9)" font-family="system-ui,sans-serif" font-size="28" font-weight="700"></text>
  <text x="480" y="374" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="system-ui,sans-serif" font-size="13">Pathé Infinity</text>
  <text x="720" y="350" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="system-ui,sans-serif" font-size="28" font-weight="700">4DX</text>
  <text x="720" y="374" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-family="system-ui,sans-serif" font-size="13">+ IMAX + Dolby</text>
  <!-- tagline -->
  <text x="480" y="440" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="system-ui,sans-serif" font-size="14">Online ticketing · Unlimited subscription · pathe.be</text>
</svg>
