<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <rect width="960" height="640" fill="#0f172a"/>
  <rect x="0" y="0" width="960" height="640" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>
  <!-- grid lines -->
  <line x1="0" y1="160" x2="960" y2="160" stroke="rgba(14,165,233,0.08)" stroke-width="1"/>
  <line x1="0" y1="320" x2="960" y2="320" stroke="rgba(14,165,233,0.08)" stroke-width="1"/>
  <line x1="0" y1="480" x2="960" y2="480" stroke="rgba(14,165,233,0.08)" stroke-width="1"/>
  <line x1="240" y1="0" x2="240" y2="640" stroke="rgba(14,165,233,0.08)" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="640" stroke="rgba(14,165,233,0.08)" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="640" stroke="rgba(14,165,233,0.08)" stroke-width="1"/>
  <!-- stat cards -->
  <rect x="60" y="200" width="180" height="100" rx="10" fill="rgba(14,165,233,0.15)" stroke="rgba(14,165,233,0.3)" stroke-width="1"/>
  <text x="150" y="252" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="32" font-weight="700">40%</text>
  <text x="150" y="278" text-anchor="middle" fill="rgba(248,250,252,0.5)" font-family="system-ui,sans-serif" font-size="13">More booked jobs</text>

  <rect x="270" y="200" width="180" height="100" rx="10" fill="rgba(14,165,233,0.15)" stroke="rgba(14,165,233,0.3)" stroke-width="1"/>
  <text x="360" y="252" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="32" font-weight="700">2×</text>
  <text x="360" y="278" text-anchor="middle" fill="rgba(248,250,252,0.5)" font-family="system-ui,sans-serif" font-size="13">Faster dispatch</text>

  <rect x="480" y="200" width="180" height="100" rx="10" fill="rgba(14,165,233,0.15)" stroke="rgba(14,165,233,0.3)" stroke-width="1"/>
  <text x="570" y="252" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="32" font-weight="700">35%</text>
  <text x="570" y="278" text-anchor="middle" fill="rgba(248,250,252,0.5)" font-family="system-ui,sans-serif" font-size="13">Better cash flow</text>

  <rect x="690" y="200" width="180" height="100" rx="10" fill="rgba(14,165,233,0.15)" stroke="rgba(14,165,233,0.3)" stroke-width="1"/>
  <text x="780" y="252" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="32" font-weight="700">4.8</text>
  <text x="780" y="278" text-anchor="middle" fill="rgba(248,250,252,0.5)" font-family="system-ui,sans-serif" font-size="13">Customer rating</text>

  <!-- wordmark -->
  <text x="480" y="130" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="52" font-weight="800" letter-spacing="-1">ServLoom</text>
  <text x="480" y="158" text-anchor="middle" fill="rgba(248,250,252,0.45)" font-family="system-ui,sans-serif" font-size="16" letter-spacing="2">FIELD SERVICE PLATFORM</text>

  <!-- tagline -->
  <text x="480" y="380" text-anchor="middle" fill="rgba(248,250,252,0.7)" font-family="system-ui,sans-serif" font-size="19">Book · Dispatch · Invoice · Collect</text>
  <text x="480" y="414" text-anchor="middle" fill="rgba(248,250,252,0.35)" font-family="system-ui,sans-serif" font-size="14">10,000+ service businesses · servloom.com</text>
</svg>
